<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find quality espresso with HotShop app."
    />
    <title>HotShot Espresso Finder</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      /* Reset some default styles */
      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: #ffffff;
        color: #080808;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      main {
        border-top: 1px solid #271d36;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-shrink: 1;
        flex-grow: 1;
        min-height: 0;
      }

      .content-container {
        overflow: auto;
        padding: 2rem 2rem 0;
        padding-bottom: 2.2rem;
      }

      .text-container {
        flex-grow: 1;
      }

      h1 {
        font-size: 3rem;
        font-weight: 400;
        margin-top: 0;
        margin-bottom: 1.5rem;
        color: #271d36;
        flex-shrink: 0;
      }

      h2 {
        font-size: 2rem;
        margin-top: 0;
        margin-bottom: 3rem;
        color: #080808;
        flex-shrink: 0;
      }

      h3 {
        font-size: 5rem;
        font-weight: 400;
        margin-top: 0;
        margin-bottom: 2rem;
        color: #271d36;
        flex-shrink: 0;
      }

      .icon-container {
        width: 200px;
        height: 200px;
        border: 3px solid #000;
        border-radius: 30px;
        overflow: hidden;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 2.5rem;
      }

      .button-container {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }

      a.button {
        background-color: transparent;
        border: 2px solid #2269cc;
        color: #080808;
        text-decoration: none;
        font-size: 1.1rem;
        padding: 0.75rem;
        border-radius: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 220px;
      }

      a.button:hover,
      a.button:focus {
        background-color: #dfdbe5;
      }

      a.button:focus-visible {
        outline: 3px solid #69d5fb;
        outline-offset: 3px;
      }

      footer {
        flex-shrink: 0;
        flex-grow: 0;
        text-align: center;
        padding: 0.75rem 2rem 1rem;
        font-size: 0.9rem;
        background-color: #dfdbe5;
        color: #080808;
        border-top: 1px solid #271d36;
      }

      .privacy-policy {
        position: absolute;
        bottom: 0;
        right: 0;
        margin: 0;
        background-color: #271d36;
        padding: 0.4rem 1rem;
        border-top-left-radius: 0.5rem;
      }

      .privacy-policy a {
        color: #dfdbe5;
        text-decoration: none;
      }

      .privacy-policy a:hover,
      .privacy-policy a:focus {
        text-decoration: underline;
      }

      p {
        margin-bottom: 2rem;
      }

      footer p {
        margin-bottom: 1.5rem;
      }

      .icon-container img {
        content: url("./app-icon.png"); /* default light mode image */
        width: 200px;
        height: 200px;
      }

      /* Dark mode styles */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #080808;
          color: #ffffff;
        }

        main {
          border-top: 1px solid #dfdbe5;
        }

        h1,
        h3 {
          color: #dfdbe5;
        }

        h2 {
          color: #ffffff;
        }

        .icon-container {
          border: 3px solid #fff;
        }

        a.button {
          background-color: transparent;
          border: 2px solid #69d5fb;
          color: #ffffff;
        }
        a.button:hover,
        a.button:focus {
          background-color: #271d36;
        }

        a.button:focus-visible {
          outline: 3px solid #1f5fb8;
          outline-offset: 3px;
        }

        .privacy-policy {
          background-color: #dfdbe5;
          font-size: 0.7rem;
        }

        .privacy-policy a {
          color: #080808;
        }

        footer {
          background-color: #271d36;
          color: #ffffff;
          border-top: 1px solid #dfdbe5;
        }
      }

      @media (max-width: 900px) {
        h2 {
          font-size: 1.5rem;
        }

        h3 {
          font-size: 3rem;
        }

        .content-container {
          padding-left: 0.5rem;
          padding-right: 0.5rem;
        }

        .button-container {
          gap: 0.5rem;
        }

        a.button {
          font-size: 0.8rem;
          width: 160px;
        }

        .icon-container {
          width: 150px;
          height: 150px;
        }

        .icon-container img {
          width: 150px;
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content-container">
        <div class="text-container">
          <h1>HotShot</h1>
          <h2>FIND QUALITY ESPRESSO</h2>

          <div class="icon-container">
            <img src="./app-icon.png" alt="App icon" />
          </div>

          <h3>life is too short for bad coffee</h3>
        </div>
      </div>
    </main>

    <footer>
      <p>
        Get early access and download the beta version today for a sneak peek!
      </p>

      <div
        class="button-container"
        role="navigation"
        aria-label="Primary links"
      >
        <a
          href="https://testflight.apple.com/join/xfsZHxWb"
          target="_blank"
          class="button"
          role="button"
          >Apple App Store</a
        >
        <a
          href="https://play.google.com/apps/testing/com.lenzi.erickson.HotShots"
          target="_blank"
          class="button"
          role="button"
          >Google Play</a
        >
      </div>

      <p class="privacy-policy">
        <a href="/privacy-policy">Privacy Policy</a>
      </p>
    </footer>
  </body>
</html>
