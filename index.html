<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find quality espresso with HotShop app."
    />
    <title>HotShot Espresso Finder</title>
    <style>
      /* Reset some default styles */
      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: #ffffff;
        color: #080808;
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      main {
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-shrink: 1;
        flex-grow: 1;
        min-height: 0;
      }

      main > div {
        overflow: auto;
        padding-top: 2rem;
        padding-bottom: 5rem;
      }

      h1 {
        font-size: 3rem;
        font-weight: 400;
        margin-top: 0;
        margin-bottom: 1.5rem;
        color: #271d36;
      }

      h2 {
        font-size: 2rem;
        margin-top: 0;
        margin-bottom: 3rem;
        color: #080808;
      }

      h3 {
        font-size: 5rem;
        font-weight: 400;
        margin-top: 0;
        margin-bottom: 2rem;
        color: #271d36;
      }

      .icon-container {
        width: 200px;
        height: 200px;
        border: 3px solid #000;
        border-radius: 30px;
        overflow: hidden;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 2.5rem;
      }

      .button-container {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      a.button {
        background-color: transparent;
        border: 2px solid #2269cc;
        color: #080808;
        text-decoration: none;
        font-size: 1.1rem;
        padding: 0.75rem 2rem;
        border-radius: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 220px;
      }

      a.button:hover,
      a.button:focus {
        background-color: #dfdbe5;
      }

      a.button:focus-visible {
        outline: 3px solid #69d5fb;
        outline-offset: 3px;
      }

      footer {
        flex-shrink: 0;
        flex-grow: 0;
        text-align: center;
        padding: 0.75rem 2rem;
        font-size: 0.9rem;
        background-color: #dfdbe5;
        color: #080808;
        border-top: 1px solid #271d36;
      }

      footer a {
        color: #2269cc;
        text-decoration: none;
      }

      footer a:hover,
      footer a:focus {
        text-decoration: underline;
      }

      p {
        margin-bottom: 2rem;
      }

      .icon-container img {
        content: url("./app-icon.png"); /* default light mode image */
        width: 200px;
        height: auto;
      }

      /* Dark mode styles */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #080808;
          color: #ffffff;
        }

        h1,
        h3 {
          color: #dfdbe5;
        }

        h2 {
          color: #ffffff;
        }

        .icon-container {
          border: 3px solid #fff;
        }

        a.button {
          background-color: transparent;
          border: 2px solid #69d5fb;
          color: #ffffff;
        }
        a.button:hover,
        a.button:focus {
          background-color: #271d36;
        }

        a.button:focus-visible {
          outline: 3px solid #1f5fb8;
          outline-offset: 3px;
        }

        footer {
          background-color: #271d36;
          color: #ffffff;
          border-top: 1px solid #dfdbe5;
        }

        footer a {
          color: #69d5fb;
        }

        .icon-container img {
          content: url("./app-icon-dark.png"); /* dark mode image */
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>HotShot</h1>
        <h2>FIND QUALITY ESPRESSO</h2>

        <div class="icon-container">
          <img src="./app-icon.png" alt="App icon" />
        </div>

        <h3>life is too short for bad coffee</h3>

        <p>
          Get early access and download the beta version today for a sneak peek!
        </p>

        <div
          class="button-container"
          role="navigation"
          aria-label="Primary links"
        >
          <a href="#" class="button" role="button">Apple App Store</a>
          <a href="#" class="button" role="button">Google Play</a>
        </div>
      </div>
    </main>

    <footer>
      <a href="/privacy-policy">Privacy Policy</a>
    </footer>
  </body>
</html>
